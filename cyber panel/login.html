<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="l" type="image/x-icon">
    <title>Cyber Tool Panel | Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
    <div class="container nav-container">
        <a href="index.html" class="logo"><span>◈</span> CYBER TOOL PANEL</a>

        <input type="checkbox" id="menu-toggle">
        <label for="menu-toggle" class="menu-btn">☰</label>

        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="services.html">Services</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="reports.html">Reports</a>
            <a href="contact.html">Contact</a>
            <a href="login.html" class="nav-login active">Login</a>
        </nav>
    </div>
</header>

<main>

<section class="login-section">

    <div class="login-card">

        <div class="login-logo">
            <div>◈</div>
            <h1>Cyber Tool Panel</h1>
            <p>Secure access portal</p>
        </div>

        <form>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="Enter your password">
            </div>

            <div class="remember-row">
                <label>
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="btn primary-btn login-btn">
                Sign In
            </button>

        </form>

        <div class="login-footer">
            <p>Don't have an account?</p>
            <a href="contact.html">Contact Support</a>
        </div>

    </div>

</section>

</main>

<footer class="footer">
    <div class="copyright">© 2026 Cyber Tool Panel. All Rights Reserved.</div>
</footer>

</body>
</html>
